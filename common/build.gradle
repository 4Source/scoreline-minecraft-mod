plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id 'jacoco'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    // Fabric and NeoForge both bundle Fabric Mixin, so it is safe to use it in common
    // If you need to update, check what version they are using to see what is compatible
    // https://github.com/neoforged/NeoForge/blob/26.3.x/gradle.properties#L37
    // https://github.com/FabricMC/fabric-loader/blob/master/gradle.properties#L12
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
    // Fabric and NeoForge both bundle MixinExtras, so it is safe to use it in common
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))
    // Unit tests dependencies (no Minecraft)
    testImplementation(platform('org.junit:junit-bom:5.14.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

def logicPackages = ['io/github/foursource/scoreline/net/**']

// The compiled classes of main, filtered to the logic packages. A FileTree is lazy:
// Gradle evaluates it only when a task runs, after compileJava has produced the classes.
def logicClasses = files(sourceSets.main.output.classesDirs).asFileTree.matching {
    include logicPackages
}

tasks.named('jacocoTestReport') {
    classDirectories.setFrom(logicClasses)
}

tasks.named('jacocoTestCoverageVerification') {
    classDirectories.setFrom(logicClasses)
    violationRules {
        rule {
            limit { counter = 'LINE';   value = 'COVEREDRATIO'; minimum = 0.95 }
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 0.90 }
        }
    }
    dependsOn tasks.named('test')
    dependsOn checkLogicPackages
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification'), tasks.named('jacocoTestReport')
}

def checkLogicPackages = tasks.register('checkLogicPackages') {
    dependsOn tasks.named('compileJava')
    doLast {
        if (logicClasses.isEmpty()) {
            throw new GradleException('Coverage gate: no classes match logicPackages')
        }
    }
}