# Versions of every library and Gradle plugin the build uses. Gradle reads this file by itself and gives each project
# an accessor `libs` (a `-` in a name becomes a `.`: `junit-bom` is `libs.junit.bom`). build-logic reads it too, see
# build-logic/settings.gradle. 

[versions]
junit = "5.14.4"
# The Eclipse formatter Spotless runs; config/eclipse-formatter.xml was exported from it
eclipse-formatter = "4.41"

[libraries]
# Unit tests; jupiter and the launcher take their version from the BOM
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# Reads compiled classes for the benchmark rule check
asm = "org.ow2.asm:asm:9.8"
# NeoForge and Fabric both bundle Mixin and MixinExtras, so common only compiles against them. Keep them at the
# versions the loaders ship: https://github.com/neoforged/NeoForge/blob/26.3.x/gradle.properties
sponge-mixin = "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
mixinextras-common = "io.github.llamalad7:mixinextras-common:0.5.3"
# The Spotless Gradle plugin, as a dependency of build-logic's convention plugins
spotless-plugin-gradle = "com.diffplug.spotless:spotless-plugin-gradle:8.11.0"

[plugins]
moddev = { id = "net.neoforged.moddev", version = "2.0.147" }
jmh = { id = "me.champeau.jmh", version = "0.7.4" }
