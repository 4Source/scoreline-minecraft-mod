# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.1.0
group=io.github.foursource
java_version=25

# Common
minecraft_version=26.3
mod_name=Scoreline
mod_author=4Source
mod_id=scoreline
license=MIT
credits=
description=Shows player statistics in the TAB list.
minecraft_version_range=[26.3, 26.4)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.102
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# spark (local runs only). File ID of spark's NeoForge build for minecraft_version
# https://www.curseforge.com/minecraft/mc-mods/spark/files
# Raise it together with minecraft_version. Empty = runs start without spark.
spark_curseforge_file_id=8918574
